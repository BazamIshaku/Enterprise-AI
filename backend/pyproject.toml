[project]
name = "eunia-backend"
version = "0.1.0"
description = "EUNIA enterprise AI workspace API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "alembic>=1.14,<2.0",
  "email-validator>=2.2,<3.0",
  "pydantic>=2.9,<3.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "PyJWT>=2.9,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
postgres = ["psycopg[binary]>=3.2,<4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
